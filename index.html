<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Wi-Fi gratuit</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Animation d'apparition */
        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            text-align: center;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .wifi-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 20px;
            color: #1c1e21;
            margin-bottom: 8px;
        }

        p.subtitle {
            font-size: 14px;
            color: #606770;
            margin-bottom: 20px;
        }

        .timer-container {
            font-size: 18px;
            font-weight: bold;
            color: #e41e3f;
            margin-bottom: 16px;
            padding: 8px;
            background: #ffebe9;
            border-radius: 8px;
        }

        .math-box {
            background: #f7f8fa;
            border: 1px solid #dddfe2;
            padding: 16px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            color: #050505;
            margin-bottom: 16px;
            word-break: break-all;
            line-height: 1.4;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccd0d5;
            border-radius: 8px;
            margin-bottom: 16px;
            outline: none;
            text-align: center;
        }

        input[type="text"]:focus {
            border-color: #1877f2;
        }

        button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            background-color: #1877f2;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 8px;
        }

        button:hover {
            background-color: #166fe5;
        }

        .btn-retry {
            background-color: #42b72a;
        }

        .btn-retry:hover {
            background-color: #36a420;
        }

        .result-msg {
            margin-top: 16px;
            font-size: 16px;
            font-weight: bold;
            line-height: 1.4;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="wifi-icon">📶</div>
    <h1>Wi-Fi Gratuit Haute Vitesse</h1>
    <p class="subtitle">Vérification de sécurité requise pour accéder au réseau.</p>

    <div id="start-screen">
        <button onclick="startGame()">🔒 Se connecter</button>
    </div>

    <div id="game-screen" class="hidden">
        <div class="timer-container">
            ⏳ Temps restant : <span id="time">30</span>s
        </div>

        <div class="math-box" id="question"></div>

        <input type="text" id="answer" placeholder="Entrez la réponse..." autocomplete="off">
        <button id="btn-submit" onclick="checkAnswer()">Valider</button>
        
        <div id="result" class="result-msg"></div>
        <button id="btn-retry" class="btn-retry hidden" onclick="resetGame()">🔄 Réessayer avec un autre calcul</button>
    </div>
</div>

<script>
    // Génération automatique d'environ 100 logarithmes complexes
    const mathProblems = [];

    function generateProblems() {
        // Type 1 : log_a(b) + log_a(c) - log_a(d)
        for (let a = 2; a <= 5; a++) {
            for (let x = 2; x <= 6; x++) {
                for (let y = 2; y <= 5; y++) {
                    let val1 = Math.pow(a, x);
                    let val2 = Math.pow(a, y);
                    let val3 = Math.pow(a, 2);
                    let expr = `\\log_{${a}}(${val1}) + \\log_{${a}}(${val2}) - \\log_{${a}}(${val3})`;
                    let simpleExpr = `log${a}(${val1}) + log${a}(${val2}) - log${a}(${val3})`;
                    mathProblems.push({ expr: simpleExpr, ans: x + y - 2 });
                }
            }
        }

        // Type 2 : 2 * log_a(b) + log_a(c)
        for (let a = 2; a <= 4; a++) {
            for (let x = 1; x <= 4; x++) {
                for (let y = 1; y <= 4; y++) {
                    let val1 = Math.pow(a, x);
                    let val2 = Math.pow(a, y);
                    let simpleExpr = `2 × log${a}(${val1}) + log${a}(${val2})`;
                    mathProblems.push({ expr: simpleExpr, ans: (2 * x) + y });
                }
            }
        }

        // Type 3 : Logarithmes népériens complexes (ln)
        for (let x = 2; x <= 6; x++) {
            for (let y = 1; y <= 4; y++) {
                let simpleExpr = `ln(e^${x}) + ln(e^${y}) - ln(e^2)`;
                mathProblems.push({ expr: simpleExpr, ans: x + y - 2 });
            }
        }

        // Type 4 : Logarithmes décimaux (log10)
        for (let x = 1; x <= 5; x++) {
            for (let y = 1; y <= 4; y++) {
                let val1 = Math.pow(10, x);
                let val2 = Math.pow(10, y);
                let simpleExpr = `log10(${val1}) + log10(${val2}) - log10(100)`;
                mathProblems.push({ expr: simpleExpr, ans: x + y - 2 });
            }
        }
    }

    generateProblems();

    let currentProblem = null;
    let timeLeft = 30;
    let timerInterval = null;

    function startGame() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        loadNewQuestion();
    }

    function loadNewQuestion() {
        clearInterval(timerInterval);
        timeLeft = 30;
        document.getElementById('time').innerText = timeLeft;
        document.getElementById('result').innerText = "";
        document.getElementById('answer').value = "";
        document.getElementById('answer').disabled = false;
        document.getElementById('btn-submit').classList.remove('hidden');
        document.getElementById('btn-retry').classList.add('hidden');

        // Sélection au hasard parmi la liste d'environ 100 calculs
        let randomIndex = Math.floor(Math.random() * mathProblems.length);
        currentProblem = mathProblems[randomIndex];
        document.getElementById('question').innerText = currentProblem.expr + " = ?";

        startTimer();
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('time').innerText = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                finishGame(false, "DOMMAGE CONTINUE D'UTILISER TA 5G 📶 (Temps écoulé)");
            }
        }, 1000);
    }

    function checkAnswer() {
        let userAns = document.getElementById('answer').value.trim();
        if (userAns === "") return;

        clearInterval(timerInterval);

        if (parseInt(userAns) === currentProblem.ans) {
            finishGame(true, "CONTINUE D'UTILISER TA 5G 📶");
        } else {
            finishGame(false, "DOMMAGE CONTINUE D'UTILISER TA 5G 📶");
        }
    }

    function finishGame(isSuccess, message) {
        document.getElementById('answer').disabled = true;
        document.getElementById('btn-submit').classList.add('hidden');
        document.getElementById('btn-retry').classList.remove('hidden');

        let resultDiv = document.getElementById('result');
        resultDiv.innerText = message;
        resultDiv.style.color = isSuccess ? "#42b72a" : "#e41e3f";
    }

    function resetGame() {
        loadNewQuestion();
    }
</script>

</body>
</html>
